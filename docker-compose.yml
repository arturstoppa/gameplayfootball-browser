version: "3.8"

services:
  gameplayfootball:
    build: .
    container_name: gameplayfootball
    ports:
      - "6080:6080"
    environment:
      - DISPLAY=:1
      - LIBGL_ALWAYS_SOFTWARE=1
      - GALLIUM_DRIVER=llvmpipe
      - ALSOFT_DRIVERS=null
    shm_size: "512mb"
    restart: unless-stopped

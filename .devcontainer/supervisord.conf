[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:xvfb]
command=Xvfb :1 -screen 0 800x600x16 +extension GLX -ac
autorestart=true
priority=1
stdout_logfile=/tmp/xvfb.log
stderr_logfile=/tmp/xvfb.log

[program:x11vnc]
command=bash -c "sleep 3 && x11vnc -display :1 -nopw -forever -shared -noxdamage -nocursorshape -rfbport 5900 -framerate 30"
autorestart=true
priority=2
stdout_logfile=/tmp/x11vnc.log
stderr_logfile=/tmp/x11vnc.log

[program:novnc]
command=bash -c "sleep 4 && websockify --web=/usr/share/novnc/ --wrap-mode=ignore 6080 localhost:5900"
autorestart=true
priority=3
stdout_logfile=/tmp/novnc.log
stderr_logfile=/tmp/novnc.log

[program:game]
command=bash -c "sleep 6 && python3 -m gfootball.play_game --action_set=full --render_resolution_x=800 --render_resolution_y=600"
environment=DISPLAY=":1",LIBGL_ALWAYS_SOFTWARE="1",GALLIUM_DRIVER="llvmpipe",ALSOFT_DRIVERS="null"
autorestart=true
priority=4
stdout_logfile=/tmp/game.log
stderr_logfile=/tmp/game.log
